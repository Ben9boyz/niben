name: CI

on:
  push:
  pull_request:

jobs:
  # types, the "no any" rule, unit tests and a production build
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix desktop # (the desktop app's types – electron – for the type check)
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # api.php against a real MySQL: accounts, rooms, access, caches, mail (Spotify is a fake)
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: niben_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NIBEN_TEST_DB: niben_test
      NIBEN_TEST_DB_USER: root
      NIBEN_TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql, openssl }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./tests/api/run.sh

  # the real front end in Chromium: switching rooms, logging in, the admin
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: niben_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NIBEN_TEST_DB: niben_test
      NIBEN_TEST_DB_USER: root
      NIBEN_TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql, openssl }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./tests/e2e/run.sh
